<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Dubnectar</title>
  <link rel="stylesheet" href="css/styles.css?v=12">
</head>
<body>
  <div class="contact-bg-overlay" aria-hidden="true"></div>
  <div class="smoke-layer" id="smoke-layer" aria-hidden="true">
    <div class="smoke-blob" data-blob="0" data-rotation="0"></div>
    <div class="smoke-blob" data-blob="1" data-rotation="-18"></div>
    <div class="smoke-blob" data-blob="2" data-rotation="8"></div>
    <div class="smoke-blob" data-blob="3" data-rotation="25"></div>
    <div class="smoke-blob" data-blob="4" data-rotation="-8"></div>
    <div class="smoke-blob" data-blob="5" data-rotation="12"></div>
    <div class="smoke-blob" data-blob="6" data-rotation="-22"></div>
    <div class="smoke-blob" data-blob="7" data-rotation="6"></div>
    <div class="smoke-blob" data-blob="8" data-rotation="-12"></div>
    <div class="smoke-blob" data-blob="9" data-rotation="18"></div>
  </div>
  <header class="site-header">
    <div class="inner">
      <a href="index.html" class="logo">
        <span class="logo-blend"><img src="images/dubnectar-logo.png?v=4" alt="Dubnectar" width="160" height="60"></span>
      </a>
      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="media.html">Media</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">Contact us</h1>
    <p class="page-subtitle">Bookings, press, or just saying hi — we’d love to hear from you.</p>

    <form class="contact-form" action="https://formspree.io/f/xojkldbb" method="POST">
      <input type="hidden" name="_replyto" id="contact-replyto">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="e.g. Booking enquiry">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send message</button>
    </form>

    <div class="contact-info">
      <p class="contact-info-label">Reach out</p>
      <div class="contact-buttons">
        <a href="mailto:booking@801familystudios.com" class="btn btn-primary contact-btn">Email us</a>
        <a href="https://www.instagram.com/thedubnectar/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary contact-btn">Instagram</a>
        <a href="https://www.facebook.com/newbornslaves/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary contact-btn">Facebook</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <ul class="nav-list">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="media.html">Media</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <p>© Dubnectar. All rights reserved.</p>
  </footer>
  <script src="js/smoke.js"></script>
  <script>
    document.querySelector('.contact-form').addEventListener('submit', function() {
      document.getElementById('contact-replyto').value = document.getElementById('email').value;
    });
  </script>
</body>
</html>
