<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media — Dub Nectar</title>
  <link rel="stylesheet" href="css/styles.css?v=17">
</head>
<body>
  <div class="media-bg-overlay" aria-hidden="true"></div>
  <div class="smoke-layer" id="smoke-layer" aria-hidden="true">
    <div class="smoke-blob" data-blob="0" data-rotation="0"></div>
    <div class="smoke-blob" data-blob="1" data-rotation="-18"></div>
    <div class="smoke-blob" data-blob="2" data-rotation="8"></div>
    <div class="smoke-blob" data-blob="3" data-rotation="25"></div>
    <div class="smoke-blob" data-blob="4" data-rotation="-8"></div>
    <div class="smoke-blob" data-blob="5" data-rotation="12"></div>
    <div class="smoke-blob" data-blob="6" data-rotation="-22"></div>
    <div class="smoke-blob" data-blob="7" data-rotation="6"></div>
    <div class="smoke-blob" data-blob="8" data-rotation="-12"></div>
    <div class="smoke-blob" data-blob="9" data-rotation="18"></div>
  </div>
  <header class="site-header">
    <div class="inner">
      <a href="index.html" class="logo">
        <span class="logo-blend"><img src="images/dubnectar-logo.png?v=4" alt="Dub Nectar" width="160" height="60"></span>
      </a>
      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="media.html" aria-current="page">Media</a></li>
          <li><a href="epk.html">EPK</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">Media</h1>
    <p class="page-subtitle">Tracks, live clips, and more. Add your own links below.</p>

    <section class="section">
      <h2 class="section-title">Music</h2>
      <div class="spotify-embed-wrap">
        <iframe class="spotify-embed" title="Dub Nectar on Spotify" style="border-radius:12px" src="https://open.spotify.com/embed/artist/3VOB8pqczKq08vAJYIXmeO?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
    </section>

    <section class="section section--videos">
      <h2 class="section-title">Videos</h2>
      <div class="video-stack">
        <div class="video-embed-wrap">
          <iframe width="560" height="315" src="https://www.youtube.com/embed/EoBzsd-HiXo?si=T4Zd0s2lYVKvGLE8" title="Dub Nectar YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="video-embed-wrap">
          <video controls preload="metadata">
            <source src="videos/dubnectvid.mov" type="video/quicktime">
            Your browser does not support this video tag.
          </video>
        </div>
      </div>
    </section>

    <p style="color: var(--text-muted);">
      Follow us on social for more clips and updates — links on the <a href="contact.html">contact page</a>.
    </p>
  </main>

  <footer class="site-footer">
    <ul class="nav-list">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="media.html">Media</a></li>
      <li><a href="epk.html">EPK</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <p>© Dub Nectar. All rights reserved.</p>
  </footer>
  <script src="js/smoke.js"></script>
</body>
</html>
